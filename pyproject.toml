[project]
name = "expense-tracker-mcp-server"
version = "0.2.0"
description = "A modular MCP server for expense tracking, category analytics, monthly reports, and budgets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
